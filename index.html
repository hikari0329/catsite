	<script>
	  // JavaScript代碼
	  $(document).ready(function() {
		// 編輯資料按鈕點擊事件
		$('.editProductBtn').click(function() {
		  // 在此處理彈出模態對話框和填充資料的邏輯
		  $('#editProductModal').modal('show');
		});

		// 上傳圖片預覽
		$('#productImages').change(function() {
		  $('#imagePreview').html('');
		  if (this.files) {
			Array.from(this.files).forEach(file => {
			  const reader = new FileReader();
			  reader.onload = function(e) {
				$('#imagePreview').append(`<img src="${e.target.result}" alt="" style="max-width: 100px; max-height: 100px; margin-right: 5px;">`);
			  }
			  reader.readAsDataURL(file);
			});
		  }
		});

		// 確認按鈕點擊事件
		$('#saveProductBtn').click(function() {
		  // 在此處理提交表單和上傳圖片的邏輯
		  // 可以使用AJAX發送表單數據到後台PHP文件進行處理
		});
	  });
	  
	$('#saveProductBtn').click(function() {
		// 獲取表單數據
		var productName = $('#productName').val();
		var productPrice = $('#productPrice').val();
		var productNote = $('#productNote').val();
		var formData = new FormData($('#editProductForm')[0]);

		// 使用 AJAX 發送請求
		$.ajax({
			type: 'POST',
			url: 'save_product.php', // 後端 PHP 文件的路徑
			data: formData, // 表單數據
			processData: false,
			contentType: false,
			success: function(response) {
				// 請求成功處理的回調函數
				console.log(response);
				// 在這裡可以根據後端返回的結果做相應的處理，例如顯示成功消息或重新加載頁面等
			},
			error: function(xhr, status, error) {
				// 請求失敗處理的回調函數
				console.error(xhr.responseText);
				// 在這裡可以顯示錯誤消息或者做相應的錯誤處理
			}
		});
	});	  
	</script>		

	
	<script>
		trList = ['leftUp', 'moveRight', 'moveDown', 'centerBig', 'rightDownBig'];
		var swiper = new Swiper('.swiper-banner', {
			speed: 1000,
			autoplay: 4400,
			autoplayDisableOnInteraction: false,
			effect: 'fade',
			pagination: '.swiper-pagination',
			paginationClickable: true,
			onSlideChangeStart: function (swiper) {
				nextSlide = swiper.slides.eq(swiper.activeIndex);
				nextSlide.addClass(trList[Math.floor(Math.random() * 5)]);
			},
			onSlideChangeEnd: function (swiper) {
				prevSlide = swiper.slides[swiper.previousIndex];
				prevSlide.className = "swiper-slide";
			},
		});
